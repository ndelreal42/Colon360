<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#56CCF2"/>
      <stop offset="100%" stop-color="#2F80ED"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2F80ED"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>
  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#sky)"/>
  <!-- Mar -->
  <rect y="310" width="512" height="202" rx="0" fill="url(#sea)"/>
  <rect y="290" width="512" height="40" rx="20" fill="#2F80ED"/>
  <!-- Sol -->
  <circle cx="320" cy="160" r="70" fill="#F7B731"/>
  <circle cx="320" cy="160" r="55" fill="#F9CA24"/>
  <!-- Palmera - tronco -->
  <rect x="118" y="200" width="14" height="130" rx="7" fill="#8D6E63" transform="rotate(-8, 125, 265)"/>
  <!-- Palmera - hojas -->
  <ellipse cx="105" cy="185" rx="55" ry="18" fill="#27AE60" transform="rotate(-30, 105, 185)"/>
  <ellipse cx="145" cy="170" rx="55" ry="18" fill="#2ECC71" transform="rotate(10, 145, 170)"/>
  <ellipse cx="90" cy="175" rx="50" ry="16" fill="#27AE60" transform="rotate(-60, 90, 175)"/>
  <!-- Texto Colón -->
  <text x="256" y="365" font-family="Georgia, serif" font-size="90" font-weight="bold" fill="white" text-anchor="middle" stroke="#1565C0" stroke-width="3">Colón</text>
  <!-- Texto 360 -->
  <text x="256" y="445" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#F7B731" text-anchor="middle" stroke="#1565C0" stroke-width="2">360</text>
</svg>
