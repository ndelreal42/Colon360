<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2E2216">
<title>Colón 360 — Panel</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Alfa+Slab+One&family=DM+Sans:wght@400;500;700;800&display=swap">
<style>
:root{
  --tinta:#2E2216; --perg:#F6EBCF; --selva:#22402C; --ambar:#E9A23B; --ambar2:#D9822B;
  --rio1:#A9D6C4; --rio2:#4E9E86; --rio3:#2F7D6D; --musgo:#6A9A3E; --musgo2:#3F6E2A;
  --hoja:#C5DBA2; --arcilla:#E8B47A; --suave:#5E4B33; --madera:#4A3220; --marco:#6B4A2B;
  --blanco:#FFFBF0; --linea:#E7D6AF; --cel:#F8EED6; --amar:#EFC766; --amar2:#F3DB9E;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--selva);color:var(--tinta);font-family:'Poppins',system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--rio3)}
h1,h2,h3{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;letter-spacing:.2px;margin:0}
h1{font-size:32px} h2{font-size:21px} h3{font-size:17px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}

/* ---------- marco ---------- */
.root{min-height:100vh;padding:24px;position:relative;overflow-x:clip}
.deco{position:absolute;z-index:0;pointer-events:none}
.shell{position:relative;z-index:1;max-width:1400px;margin:0 auto;background:var(--perg);border:8px solid var(--marco);box-shadow:inset 0 0 0 2px var(--tinta),0 0 0 2px var(--tinta);border-radius:28px;padding:16px;display:flex;gap:24px;align-items:flex-start;min-height:calc(100vh - 48px)}
.vine{position:absolute;left:0;right:0;top:-16px;width:100%;height:40px;z-index:3;pointer-events:none}

/* ---------- menú de madera ---------- */
.side{flex:0 0 236px;align-self:stretch;background-color:var(--madera);background-image:repeating-linear-gradient(91deg,rgba(0,0,0,.13) 0 2px,transparent 2px 15px),repeating-linear-gradient(89deg,rgba(255,255,255,.05) 0 1px,transparent 1px 8px);border:3px solid var(--tinta);border-radius:22px;padding:20px 14px;color:var(--perg);display:flex;flex-direction:column;gap:4px;position:sticky;top:16px;max-height:calc(100vh - 80px);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px}
.brand img{width:48px;height:48px;border-radius:14px;display:block}
.brand b{display:block;font-size:19px;line-height:1.1}
.brand span{font-size:11px;color:var(--rio1)}
.side .grp{font-size:12px;color:var(--rio1);padding:14px 10px 4px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:9px 12px;border:0;border-radius:12px;background:transparent;color:var(--perg);font-size:14px;text-align:left}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:var(--ambar);color:var(--tinta);font-weight:600}
.nav svg{flex-shrink:0}
.nav .n{flex:1}
.badge{background:var(--ambar2);color:var(--tinta);font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px}
.side .fill{flex:1;min-height:16px}
.side .close{display:none}

/* ---------- contenido ---------- */
.content{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px;padding:6px 4px 24px}
.mtop{display:none}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.search{flex:1 1 300px;display:flex;align-items:center;gap:10px;background:var(--blanco);border:1.5px solid var(--tinta);border-radius:999px;padding:5px 14px 5px 5px;min-height:46px}
.search .ic{width:36px;height:36px;border-radius:50%;background:var(--rio1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.list .search{flex:none}
.search input{flex:1;min-width:60px;border:0;outline:0;background:transparent;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--tinta);background:var(--blanco);font-size:14px;font-weight:500;text-decoration:none;color:var(--tinta);white-space:nowrap}
.btn.dark{background:var(--tinta);color:var(--perg);border-color:var(--tinta);font-weight:600}
.btn.amb{background:var(--ambar);font-weight:600}
.btn.verde{background:var(--musgo2);color:#FFFBF0;border-color:var(--musgo2);font-weight:600}
.btn.ghost{background:transparent}
.btn.peligro{background:transparent;border-color:#8A2B1F;color:#8A2B1F}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--tinta);background:var(--blanco);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{margin:4px 0 0;font-size:14px;color:var(--suave);max-width:680px;line-height:1.5}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--tinta);white-space:nowrap}
.muted{color:var(--suave)}
.small{font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.split > .list{flex:1 1 360px;min-width:0;max-width:520px;display:flex;flex-direction:column;gap:10px}
.split > .detail{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--blanco);border:1.5px solid var(--tinta);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative}
.panel.rio{background:var(--rio1);border-color:transparent}
.panel.amar{background:var(--amar);border-color:transparent}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips .lbl{font-size:12px;font-weight:600;color:var(--suave);min-width:70px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--tinta);background:var(--blanco);font-size:13px}
.chip.on{background:var(--tinta);color:var(--perg);font-weight:600}
.chip .c{opacity:.75}

/* tarjetas de lista */
.item{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:16px;border:1.5px solid var(--linea);background:var(--blanco)}
.item.on{border:2px solid var(--tinta);background:var(--rio1)}
.item .main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:0;text-align:left;min-height:48px}
.item .tt{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .st{font-size:12px;color:var(--suave);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.dot{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;color:var(--tinta)}
.emo{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sw{display:flex;align-items:center;gap:8px;min-height:40px;border-radius:999px;padding:0 12px 0 5px;font-size:12px;font-weight:600;border:1.5px solid var(--tinta);background:var(--blanco);flex-shrink:0}
.sw .k{width:28px;height:28px;border-radius:50%;background:var(--linea);border:1.5px solid var(--tinta)}
.sw.on{background:var(--musgo2);color:#FFFBF0}
.sw.on .k{background:#FFFBF0;border-color:#FFFBF0}
.empty{padding:26px;text-align:center;font-size:14px;color:var(--suave);background:var(--blanco);border-radius:16px;border:1.5px dashed var(--linea)}

/* formularios */
.form{display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:2fr 1.4fr .8fr;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;min-width:0}
label.f .h{font-weight:400;color:var(--suave);font-size:11px}
.in{border:1.5px solid var(--tinta);border-radius:12px;padding:0 12px;min-height:44px;font-size:14px;background:var(--perg);width:100%;min-width:0}
textarea.in{padding:10px 12px;resize:vertical;min-height:70px;line-height:1.45}
select.in{padding:0 8px}
.in[readonly]{background:var(--linea);color:var(--suave)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--musgo2)}
.colors{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.colors button{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--perg)}
.colors button.on{border:3px solid var(--tinta)}
.msg{border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600}
.msg.ok{background:var(--musgo2);color:#FFFBF0}
.msg.err{background:var(--arcilla)}
.msg.info{background:var(--amar2)}
.back{display:none}

/* inicio */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;min-height:130px;border:0;text-align:left;font-size:14px}
.card .big{font-size:36px;font-weight:700;line-height:1;position:relative}
.card .t{font-size:15px;font-weight:600;position:relative}
.card .s{font-size:12px;position:relative}
.card svg.bg{position:absolute;right:-24px;top:-24px;opacity:.9}
.lst{display:flex;flex-direction:column;gap:8px}
.lst .li{display:flex;gap:10px;align-items:center;background:var(--cel);border-radius:14px;padding:10px 12px;font-size:13px}
.lst .li b{font-size:14px}
.when{width:58px;flex-shrink:0;text-align:center;border-radius:10px;border:1.5px solid var(--tinta);padding:4px 0;background:var(--amar);font-size:11px;line-height:1.2}
.when b{display:block;font-size:17px}

/* celular de vista previa (copia de DetailPage de la app) */
.phonewrap{flex:0 1 360px;min-width:290px;display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:16px}
.phone{width:348px;max-width:100%;border-radius:44px;padding:12px;background:var(--tinta)}
.screen{height:680px;border-radius:34px;overflow:hidden;background:#faf9f6;position:relative}
.screen .sc{height:100%;overflow-y:auto;font-family:'DM Sans',sans-serif}
.oculta{position:absolute;inset:0;background:rgba(46,34,22,.72);display:flex;align-items:center;justify-content:center;padding:30px;text-align:center}
.oculta div{background:var(--perg);border-radius:18px;padding:16px;font-size:13px;line-height:1.5}

/* modal y aviso */
.modal{position:fixed;inset:0;background:rgba(46,34,22,.55);z-index:80;overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding:70px 16px 16px}
.modal .box{width:100%;max-width:600px;background:var(--perg);border:2px solid var(--tinta);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;background:var(--tinta);color:var(--perg);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.3);display:none}
#toast.err{background:#8A2B1F}
.banner{display:flex;gap:12px;align-items:center;background:var(--tinta);color:var(--perg);border-radius:16px;padding:12px 16px;font-size:13px;line-height:1.5}
.banner.amb{background:var(--amar2);color:var(--tinta)}
.loading{padding:60px;text-align:center;color:var(--suave)}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:380px;background:var(--perg);border:8px solid var(--marco);box-shadow:0 0 0 2px var(--tinta),inset 0 0 0 2px var(--tinta);border-radius:26px;padding:26px;display:flex;flex-direction:column;gap:14px;text-align:center}
#login img{width:84px;height:84px;border-radius:22px;margin:0 auto}

/* botón flotante de notas */
.fab{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;align-items:center;gap:8px;min-height:56px;padding:0 20px 0 16px;border-radius:999px;background:var(--ambar);color:var(--tinta);border:2px solid var(--tinta);box-shadow:0 6px 18px rgba(0,0,0,.3);font-weight:700;font-size:15px}
.fab:hover{background:var(--ambar2)}
/* manual */
.manual{display:flex;flex-direction:column;gap:10px}
.paso{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--cel);border:1.5px solid var(--linea);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5}
.paso .num{width:30px;height:30px;border-radius:50%;background:var(--tinta);color:var(--perg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.paso.ok{background:var(--hoja);border-color:var(--musgo2)}
.paso.ok .num{background:var(--musgo2)}
.paso.ok .tx{text-decoration:line-through;color:var(--suave)}
.tip{background:var(--amar2);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5}
.vin{margin:0;padding-left:22px;line-height:1.7;font-size:14px}
/* notas */
.nota{display:flex;gap:12px;align-items:flex-start;background:var(--blanco);border:1.5px solid var(--linea);border-radius:16px;padding:12px}
.nota .tx{white-space:pre-line;font-size:14px;line-height:1.5}
.nota .chk{width:32px;height:32px;border-radius:9px;border:2px solid var(--tinta);background:var(--perg);flex-shrink:0;font-weight:700;color:#FFFBF0}
.nota.hecha .chk{background:var(--musgo2);border-color:var(--musgo2)}
.nota.hecha .tx{text-decoration:line-through;color:var(--suave)}
button.tag{font-family:inherit}

/* ---------- celular ---------- */
@media (max-width:820px){
  .root{padding:0}
  .deco,.vine{display:none}
  .shell{border-radius:0;border-width:0;box-shadow:none;padding:0 12px 12px;gap:0;min-height:100vh}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(84vw,300px);max-height:none;z-index:70;border-radius:0 22px 22px 0;transform:translateX(-105%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .side .close{display:inline-flex;align-self:flex-end;background:transparent;color:var(--perg);border-color:var(--rio1)}
  .scrim{position:fixed;inset:0;background:rgba(46,34,22,.5);z-index:65}
  .mtop{display:flex;position:sticky;top:0;z-index:40;align-items:center;gap:10px;background:var(--perg);border-bottom:1.5px solid var(--tinta);margin:0 -12px;padding:10px 12px}
  .mtop img{width:38px;height:38px;border-radius:11px}
  .mtop .ttl{flex:1;min-width:0;line-height:1.15}
  .mtop .ttl b{display:block;font-size:16px}
  .mtop .ttl span{font-size:12px;color:var(--suave)}
  .content{padding:14px 0 30px;gap:16px}
  h1{font-size:25px}
  .cards{grid-template-columns:1fr 1fr}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips > *{flex-shrink:0}
  .split > .list{max-width:none}
  .split.det > .list{display:none}
  .split:not(.det) > .detail{display:none}
  .back{display:inline-flex;align-self:flex-start}
  .g3{grid-template-columns:1fr 1fr}
  .g3 > :first-child{grid-column:1 / -1}
  .phonewrap{position:static;min-width:0;flex-basis:100%}
  .screen{height:600px}
  .panel{padding:16px}
  .in,input,select,textarea{font-size:16px !important}
  .modal{padding:12px}
  .fab{right:14px;bottom:calc(14px + env(safe-area-inset-bottom));min-height:54px;padding:0 18px 0 14px}
  .content{padding-bottom:90px}
}
@media (max-width:430px){
  .g2{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="login" hidden>
  <form class="box" id="login-form">
    <img src="logo.png" alt="Logo de Colón 360" width="84" height="84">
    <h1 style="font-size:26px">Panel Colón 360</h1>
    <p class="muted" style="margin:0;font-size:14px">Ingresá tu clave de administrador.</p>
    <label class="f" style="text-align:left">Clave<input class="in" type="password" id="clave" autocomplete="current-password" required></label>
    <button class="btn dark" type="submit">Entrar</button>
    <div id="login-err" class="msg err" hidden></div>
    <button class="btn ghost sm" type="button" data-act="demo">Probar con datos de ejemplo</button>
  </form>
</div>

<div id="app" hidden>
  <div class="root">
    <svg class="deco" id="deco1" aria-hidden="true" width="260" height="260" viewBox="0 0 220 220" style="left:-30px;top:-20px"></svg>
    <svg class="deco" id="deco2" aria-hidden="true" width="260" height="260" viewBox="0 0 220 220" style="right:-30px;bottom:-20px;transform:scale(-1,-1)"></svg>
    <div class="shell">
      <svg class="vine" id="vine" aria-hidden="true" viewBox="0 0 1400 40" preserveAspectRatio="none"></svg>
      <nav class="side" id="side" aria-label="Menú principal"></nav>
      <div id="scrim"></div>
      <div class="content">
        <header class="mtop">
          <button class="iconbtn" data-act="menu" aria-label="Abrir menú" style="background:var(--tinta);color:var(--perg);border-radius:14px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <img src="logo.png" alt="" width="38" height="38">
          <div class="ttl"><b>Colón 360</b><span id="mtitle"></span></div>
        </header>
        <div id="banner"></div>
        <main id="main"></main>
      </div>
    </div>
  </div>
</div>

<button type="button" class="fab" id="fab" data-act="nuevaNota" hidden aria-label="Nueva nota rápida"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Nota</button>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
// =====================================================================
//  Colón 360 — Panel unificado (clientes, fichas, eventos, servicios,
//  pendientes, notificaciones y cobros). Un solo archivo, sin build.
//  Habla con la API: https://colon360-api.colon360.workers.dev
// =====================================================================
const API_URL = "https://colon360-api.colon360.workers.dev";
const LS_KEY = "colon360_admin_key";

// ---------- utilidades ----------
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
const slug = (t) => norm(t).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 28) || "item";
const rnd = () => Math.random().toString(36).slice(2, 6);
const pad = (n) => String(n).padStart(2, "0");
const isoLocal = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const hoyISO = () => isoLocal(new Date());
const parseISO = (s) => { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const diasHasta = (iso) => { const d = parseISO(iso); if (!d) return null; const h = parseISO(hoyISO()); return Math.round((d - h) / 86400000); };
const sumarMes = (iso) => { const d = parseISO(iso) || new Date(); const r = new Date(d.getFullYear(), d.getMonth() + 1, d.getDate()); if (r.getDate() !== d.getDate()) r.setDate(0); return isoLocal(r); };
const MESES = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];
const MESES_L = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const DIAS_L = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];

// Mismo criterio que la app (DetailPage.jsx)
function normalizarWhatsApp(valor) {
  let d = String(valor || "").replace(/\D/g, "");
  if (!d) return null;
  if (d.startsWith("549")) { /* completo */ }
  else if (d.startsWith("54")) d = "549" + d.slice(2);
  else { d = d.replace(/^0/, ""); d = d.replace(/^(\d{2,4})15(\d{6,8})$/, "$1$2"); d = "549" + d; }
  return d.length >= 12 && d.length <= 14 ? d : null;
}
function urlSegura(valor) {
  const t = String(valor || "").trim();
  if (!t) return null;
  const u = /^[a-z][a-z0-9+.-]*:/i.test(t) ? t : "https://" + t;
  try { const x = new URL(u); return x.protocol === "http:" || x.protocol === "https:" ? x.href : null; } catch { return null; }
}
// Mismo criterio que el panel anterior: link largo de Google Maps o "lat, lng"
function parsearUbicacion(texto) {
  let t = String(texto || "").trim();
  try { t = decodeURIComponent(t); } catch { /* queda igual */ }
  const num = "(-?\\d{1,3}\\.\\d+)";
  const pats = [new RegExp("!3d" + num + "!4d" + num), new RegExp("@" + num + "," + num), new RegExp("[?&](?:q|ll|query|destination)=" + num + "[,+ ]\\s*" + num), new RegExp("^" + num + "\\s*[,; ]\\s*" + num + "$")];
  for (const re of pats) {
    const m = t.match(re);
    if (m) {
      const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return { error: "Esas coordenadas no son válidas." };
      return { lat, lng };
    }
  }
  if (/goo\.gl|maps\.app/i.test(t)) return { error: "Ese es un link corto y no trae las coordenadas. Abrilo en el navegador y copiá el link largo, o en Google Maps mantené apretado el punto y copiá los dos números." };
  return { error: "No pude leer la ubicación. Pegá el link largo de Google Maps o escribí: latitud, longitud (ej: -32.2257, -58.1417)." };
}

async function api(method, path, body) {

    method,
    headers: { "X-Admin-Key": S.key, "Content-Type": "application/json" },

  let data = null;

  if (!res.ok) {
    const e = new Error((data && (data.message || data.error)) || "Error " + res.status);
    e.status = res.status;
    throw e;
  }
  return data;
}

// ---------- eventos: entender dia/mes ----------
function fechaEvento(ev) {
  const real = parseISO(ev.fecha);
  if (real) {
    const fin = parseISO(ev.fecha_fin) || real;
    const hoyR = new Date(); hoyR.setHours(0, 0, 0, 0);
    return { tipo: "fecha", date: real, iso: ev.fecha, fin, pasado: fin < hoyR, real: true };
  }
  const dia = String(ev.dia || "").trim(), mes = String(ev.mes || "").trim().toUpperCase().slice(0, 3);
  const mi = MESES.indexOf(mes);
  if (/^todo$/i.test(dia)) return { tipo: "anio" };
  if (/^temp/i.test(dia)) return { tipo: "temp" };
  if (mi < 0 || !/^\d{1,2}$/.test(dia)) return { tipo: "raro" };
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  let y = hoy.getFullYear();
  const adelante = (mi - hoy.getMonth() + 12) % 12;
  if (mi < hoy.getMonth() && adelante <= 4) y++;   // ene/feb vistos desde nov/dic -> año que viene
  const d = new Date(y, mi, Number(dia));
  return { tipo: "fecha", date: d, iso: isoLocal(d), pasado: d < hoy };
}

function fichasFiltradas() {
  const q = norm(S.q.fx);
  const ft = S.f.fxTipo || "Todas", fe = S.f.fxEst || "Todas";
  const cliN = (l) => (clientePorId(l.cliente_id) || {}).nombre || "";
  const sinUb = (l) => l.lat === null || l.lat === undefined || l.lat === "";
  const base = S.db.lugares.filter((l) => !q || norm([l.nombre, l.id, l.tipo, l.categoria, cliN(l), (lista(l.tags)).join(" ")].join(" ")).includes(q));
  const pasaE = (l, v) => v === "Todas" || (v === "Visibles" ? esVisible(l) : v === "Ocultas" ? !esVisible(l) : v === "Sin ubicación" ? sinUb(l) : v === "De clientes" ? !!l.cliente_id : true);
  const pasa = (l, sinT, sinE) => (sinT || ft === "Todas" || l.tipo === ft) && (sinE || pasaE(l, fe));
  const tiposUsados = [...new Set([...TIPOS.map((t) => t.v), ...S.db.lugares.map((l) => l.tipo)])].filter((v) => S.db.lugares.some((l) => l.tipo === v));
  return {
    lista: base.filter((l) => pasa(l)).sort((a, b) => (a.tipo || "").localeCompare(b.tipo || "") || (a.nombre || "").localeCompare(b.nombre || "")),
    tipo: [{ v: "Todas", l: "Todas" }, ...tiposUsados.map((v) => ({ v, l: tipoLabel(v) }))].map((o) => ({ ...o, n: base.filter((l) => pasa(l, true) && (o.v === "Todas" || l.tipo === o.v)).length })),
    est: ["Todas", "Visibles", "Ocultas", "Sin ubicación", "De clientes"].map((v) => ({ v, l: v, n: base.filter((l) => pasa(l, false, true) && pasaE(l, v)).length })),
    cliN,
  };
}

function ubicInfo(f) {
  const t = String(f.ubicacion || "").trim();
  if (!t) return '<span class="small muted">Sin ubicación: no aparece en el mapa de la app.</span>';

  if (u.error) return `<div class="msg err">${esc(u.error)}</div>`;
  const lejos = !cercaDeColon(u.lat, u.lng);
  return `<span class="small" style="${lejos ? "color:#8A2B1F;font-weight:600" : ""}">${lejos ? "Ojo: queda lejos de Colón. " : "✓ "}${u.lat}, ${u.lng} · <a href="https://www.google.com/maps?q=${u.lat},${u.lng}" target="_blank" rel="noopener">Ver en Google Maps</a></span>`;
}

function vEventos() {

  const orden = (a, b) => (a.fe.date && b.fe.date ? a.fe.date - b.fe.date : a.fe.date ? -1 : b.fe.date ? 1 : (a.titulo || "").localeCompare(b.titulo || ""));
  const opciones = ["Todos", "Próximos", "Todo el año / temporada", "Pasados", "Revisar fecha"].map((v) => ({ v, l: v, n: evs.filter((e) => v === "Todos" || grupo(e) === v).length }));

function revisarAlta(d) {
  const checks = [["Nombre", !!(d.nombre || "").trim()], ["WhatsApp válido", !!normalizarWhatsApp(d.whatsapp)], ["Descripción", !!(d.desc || "").trim()], ["Horario", !!(d.horario || "").trim()], ["Dirección", !!(d.dir || "").trim()]];
  const n = norm(d.nombre);
  const dup = n ? (S.db.clientes.find((c) => norm(c.nombre) === n) || S.db.lugares.find((l) => norm(l.nombre) === n)) : null;
  return { checks, faltan: checks.filter((c) => !c[1]).map((c) => c[0]), dup };
}
function vPendientes() {
  if (S.faltaMigracion) return avisoMigracion("Pendientes");
  const p = S.d.pd;
  const lstP = S.db.pendientes;
  const card = (x) => {
    const d = x.datos || {};
    const r = x.tipo === "alta" ? revisarAlta(d) : null;
    const aviso = x.tipo === "cambio" ? [`${(x.cambios || []).length} cambios pedidos`, "#A9D6C4"] : r.dup ? ["Posible duplicado", "#2E2216;color:#F6EBCF"] : r.faltan.length ? [`Faltan ${r.faltan.length} datos`, "#D9822B"] : ["Listo para aprobar", "#3F6E2A;color:#FFFBF0"];
    const nombre = x.tipo === "cambio" ? ((S.db.lugares.find((l) => l.id === x.lugar_id) || {}).nombre || x.lugar_id) : d.nombre;
    return `<button type="button" class="item ${p && p._id === x.id ? "on" : ""}" style="flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;text-align:left" data-act="abrir" data-arg="pendientes|${esc(x.id)}"><span class="small"><b>${x.tipo === "cambio" ? "CAMBIO DE DATOS" : "ALTA NUEVA"}</b> · ${esc(x.origen || "")} · ${esc(x.recibido ? new Date(x.recibido).toLocaleString("es-AR", { dateStyle: "short", timeStyle: "short" }) : "")}</span><span style="font-size:16px;font-weight:700">${esc(nombre || "Sin nombre")}</span><span class="tag" style="background:${aviso[1]}">${esc(aviso[0])}</span></button>`;
  };
  return `<div class="head"><div><h1>Pendientes de revisión</h1><p>Lo que llega solo (formulario web, bot de WhatsApp o n8n) espera acá. Nada se publica ni cambia en la app hasta que lo apruebes.</p></div>${ejemplo()}</div>
  <div class="split ${S.det.pendientes ? "det" : ""}">
    <div class="list">${lstP.length ? lstP.map(card).join("") : `<div class="empty">No hay nada para revisar.<br><span class="small">Cuando conectemos el formulario y el bot, las altas van a caer acá.</span><br><button type="button" class="btn sm" style="margin-top:10px" data-act="pendientePrueba">Crear uno de prueba</button></div>`}</div>

  </div>`;
}
function detallePendiente(p) {
  const head = `${atras("pendientes", "Volver a pendientes")}<section class="panel"><div class="row" style="justify-content:space-between"><h2>${p.tipo === "cambio" ? "Pedido de cambio" : esc(p.d.nombre || "Alta nueva")}</h2><span class="tag" style="background:var(--rio1)">Llegó por ${esc(p.origen || "—")}</span></div>
  ${p.mensaje ? `<div style="background:var(--linea);border-radius:16px;padding:12px 14px"><div class="small" style="font-weight:700;color:var(--suave)">LO QUE LLEGÓ</div><div style="white-space:pre-line;font-size:13px;line-height:1.6">${esc(p.mensaje)}</div></div>` : ""}`;
  if (p.tipo === "cambio") {
    const l = S.db.lugares.find((x) => x.id === p.lugar_id);
    if (!l) return head + `<div class="msg err">La ficha “${esc(p.lugar_id)}” ya no existe.</div><div class="row"><button type="button" class="btn peligro" data-act="descartarPendiente">Descartar</button></div></section>`;
    return head + `<h3>Cambios en “${esc(l.nombre)}”</h3><div class="lst">${(p.cambios || []).map((c) => `<div class="li" style="flex-wrap:wrap"><b style="width:100%">${esc(c.campo || c.key)}</b><span style="flex:1 1 140px;text-decoration:line-through;color:var(--suave)">${esc(Array.isArray(l[c.key]) ? l[c.key].join(", ") : (l[c.key] ?? "(vacío)"))}</span><span style="flex:1 1 140px;background:var(--hoja);border-radius:8px;padding:2px 8px;font-weight:600">${esc(c.despues)}</span></div>`).join("")}</div>
    <div class="row"><button type="button" class="btn dark" data-act="aplicarCambio">Aplicar cambios</button><button type="button" class="btn" data-act="waPendiente" data-arg="ok">${svg("wa", 16)}Responderle</button><button type="button" class="btn peligro" data-act="descartarPendiente">Rechazar</button></div></section>`;
  }
  const d = p.d, r = revisarAlta(d);
  return head + `<div class="row">${r.checks.map(([l, ok]) => `<span class="tag" style="background:${ok ? "var(--musgo2);color:#FFFBF0" : "var(--ambar2)"}">${ok ? "✓" : "!"} ${l}</span>`).join("")}</div>
  ${r.dup ? `<div class="banner"><span style="flex:1">Parece repetido: ya existe “${esc(r.dup.nombre)}”. Si es el mismo, descartalo como repetido.</span></div>` : ""}
  <div class="form">
    ${inp("pd.d.nombre", "Nombre del comercio", d.nombre)}
    <div class="g2">${sel("pd.d.cat", "Categoría", d.cat || "Otros", CATS, 'data-r="1"')}${sel("pd.d.rubro", "Rubro", d.rubro, ["", ...(RUBROS[d.cat] || [])].map((v) => ({ v, l: v || "—" })))}${inp("pd.d.contacto", "Contacto", d.contacto)}${inp("pd.d.whatsapp", "WhatsApp", d.whatsapp, 'type="tel"')}${inp("pd.d.horario", "Horario", d.horario)}${inp("pd.d.dir", "Dirección", d.dir)}</div>
    ${txt("pd.d.desc", "Descripción", d.desc, 3)}
    ${inp("pd.d.tags", "Etiquetas (coma)", d.tags)}
    <div class="row" style="background:var(--amar);border-radius:16px;padding:12px 14px">${sel("pd.estado", "Arranca con", p.estado || "Prueba gratis", ["Prueba gratis", "Activo"])}${chk("pd.publicar", "Mostrar en la app al aprobar", p.publicar !== false)}</div>
  </div>
  <div class="row"><button type="button" class="btn dark" data-act="aprobarAlta">Aprobar y pasar a Clientes</button>${r.faltan.length ? `<button type="button" class="btn amb" data-act="waPendiente" data-arg="faltan">${svg("wa", 16)}Pedir lo que falta (${r.faltan.length})</button>` : ""}<button type="button" class="btn peligro" data-act="descartarPendiente">Descartar</button></div></section>`;
}

function previaNotif(n) {
  const hora = n.hora || "19:00";

}

function vCobros() {
  if (S.faltaMigracion) return avisoMigracion("Cobros");
  const fc = S.f.cob || "Para cobrar";
  const cl = S.db.clientes.map((c) => ({ ...c, er: estadoReal(c) })).filter((c) => c.estado !== "Baja");
  const lst = cl.filter((c) => fc === "Todos" || (fc === "Para cobrar" ? (c.er === "Vencido" || c.er === "Por vencer") : fc === "Al día" ? c.er === "Activo" : c.er === "Prueba gratis")).sort((a, b) => (a.vence || "9").localeCompare(b.vence || "9"));
  const mes = hoyISO().slice(0, 7);
  const money = (v) => S.ojo ? plata(v) : "$ ••••••";
  const cobrado = cl.filter((c) => (c.ultimo_pago || "").slice(0, 7) === mes).reduce((s, c) => s + (Number(c.precio) || S.precio), 0);
  const esperado = cl.filter((c) => c.estado === "Activo").reduce((s, c) => s + (Number(c.precio) || S.precio), 0);
  const opciones = ["Para cobrar", "Al día", "En prueba", "Todos"].map((v) => ({ v, l: v, n: cl.filter((c) => v === "Todos" || (v === "Para cobrar" ? (c.er === "Vencido" || c.er === "Por vencer") : v === "Al día" ? c.er === "Activo" : c.er === "Prueba gratis")).length }));
  return `<div class="head"><div><h1>Cobros</h1><p>Quién pagó y quién debe. “Registrar pago” corre el vencimiento un mes; “Avisar” arma el mensaje de WhatsApp.</p></div><div class="row">${ejemplo()}<button type="button" class="iconbtn" data-act="ojo" aria-label="${S.ojo ? "Ocultar montos" : "Mostrar montos"}">${svg(S.ojo ? "ojo" : "ojoNo", 20)}</button></div></div>
  <div class="cards"><div class="card" style="background:var(--hoja)"><span class="t">Cobrado este mes</span><span class="big">${money(cobrado)}</span></div><div class="card" style="background:var(--amar)"><span class="t">Esperado por mes</span><span class="big">${money(esperado)}</span><span class="s">clientes con plan activo</span></div></div>
  ${chips("Mostrar", "cob", opciones, fc)}
  <div class="lst">${lst.length ? lst.map((c) => `<div class="li" style="flex-wrap:wrap;background:var(--blanco);border:1.5px solid var(--linea)"><span class="dot" style="background:${CAT_COLOR[c.cat] || "#E7D6AF"}">${esc(iniciales(c.nombre))}</span><span style="flex:1;min-width:160px"><b>${esc(c.nombre)}</b><br><span class="muted small">vence ${fechaCorta(c.vence)} · último pago ${fechaCorta(c.ultimo_pago)} · ${money(Number(c.precio) || S.precio)}</span></span>${chip(c.er)}<button type="button" class="btn sm amb" data-act="registrarPago" data-arg="${esc(c.id)}">Registrar pago</button><button type="button" class="btn sm" data-act="cobrarWa" data-arg="${esc(c.id)}">${svg("wa", 16)}Avisar</button></div>`).join("") : '<div class="empty">Nada en esta lista.</div>'}</div>`;
}

const cuerpoHTML = (texto, ticks, id) => {
  let n = 0, html = "", ul = false;
  const fin = () => { if (ul) { html += "</ul>"; ul = false; } };
  const fmt = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  String(texto || "").split("\n").forEach((raw) => {
    const l = raw.trim();
    if (!l) { fin(); return; }
    let m;
    if ((m = l.match(/^\d+[.)]\s*(.*)$/))) {
      fin(); const i = n++; const ok = !!(ticks && ticks[i]);
      html += `<button type="button" class="paso ${ok ? "ok" : ""}" data-act="tildar" data-arg="${esc(id)}|${i}" aria-pressed="${ok}"><span class="num">${ok ? "✓" : i + 1}</span><span class="tx">${fmt(m[1])}</span></button>`;
    } else if ((m = l.match(/^[-•]\s*(.*)$/))) { if (!ul) { html += '<ul class="vin">'; ul = true; } html += `<li>${fmt(m[1])}</li>`; }
    else if ((m = l.match(/^!\s*(.*)$/))) { fin(); html += `<div class="tip">💡 ${fmt(m[1])}</div>`; }
    else if ((m = l.match(/^##\s*(.*)$/))) { fin(); html += `<h3>${fmt(m[1])}</h3>`; }
    else { fin(); html += `<p style="margin:0;line-height:1.6">${fmt(l)}</p>`; }
  });
  fin();
  return html;
};

async function demoApi(method, path, body) {
  await new Promise((r) => setTimeout(r, 120));
  const m = path.match(/^\/([^/?]+)(?:\/([^/?]+))?/);
  const t = m[1], id = m[2] ? decodeURIComponent(m[2]) : undefined;
  if (t === "admin") return { ok: true };
  const tab = DEMO[t];
  if (!tab) throw new Error("Not found");
  const copia = (x) => JSON.parse(JSON.stringify(x));
  if (method === "GET") return copia(tab);
  if (method === "POST") {
    const row = copia(body);
    if (t === "servicios") row.id = Math.max(0, ...tab.map((x) => x.id)) + 1;
    if (tab.some((x) => String(x.id) === String(row.id))) throw new Error("UNIQUE constraint failed");
    tab.push(row); return { ok: true };
  }
  const i = tab.findIndex((x) => String(x.id) === String(id));
  if (method === "PUT") { if (i >= 0) { const b = copia(body); delete b.id; Object.assign(tab[i], b); } return { ok: true }; }
  if (method === "DELETE") { if (i >= 0) tab.splice(i, 1); return { ok: true }; }
}

    S.d.pd = null; S.det.pendientes = false; render();
  },
  async descartarPendiente() {
    if (!confirm("¿Descartar este pendiente?")) return;
    if (await borrar("pendientes", S.d.pd._id, "Descartado.")) { S.d.pd = null; S.det.pendientes = false; render(); }
  },
  waPendiente(tipo) {
    const p = S.d.pd;
    if (tipo === "faltan") {
      const r = revisarAlta(p.d);
      abrirWa(p.d.whatsapp, `¡Hola${p.d.contacto ? " " + p.d.contacto : ""}! Soy Nahuel de Colón 360. Para publicar “${p.d.nombre}” en la app me faltan: ${r.faltan.join(", ").toLowerCase()}. ¿Me los pasás por acá? ¡Gracias!`);
    } else {
      const l = S.db.lugares.find((x) => x.id === p.lugar_id) || {};
      const c = clientePorId(l.cliente_id) || {};
      abrirWa(c.whatsapp || l.whatsapp, `¡Listo! Ya actualicé ${l.nombre || "tu ficha"} en Colón 360. Gracias por avisar.`);
    }
  },


  // ---------- manual ----------
  verManual(id) { S.man.sel = id; S.man.edit = false; S.det.manual = true; render(); arriba(); },
  tildar(arg) { const i = arg.lastIndexOf("|"), id = arg.slice(0, i), n = arg.slice(i + 1); const t = S.man.ticks[id] || (S.man.ticks[id] = {}); t[n] = !t[n]; render(); },
  reiniciarPasos(id) { S.man.ticks[id] = {}; render(); },
  nuevoManual() { S.man.edit = true; S.man.draft = { _id: null, titulo: "", resumen: "", emoji: "📘", cuerpo: "1. \n2. \n3. " }; S.d.man = S.man.draft; S.det.manual = true; render(); arriba(); },
  editarManual(id) { const x = S.db.manual.find((y) => y.id === id); if (!x) return; S.man.edit = true; S.man.draft = { ...x, _id: x.id }; S.d.man = S.man.draft; render(); arriba(); },
  cancelarManual() { S.man.edit = false; if (!S.man.sel) S.det.manual = false; render(); },
  async guardarManual() {
    const d = S.man.draft;
    if (!String(d.titulo || "").trim()) { toast("Falta el título.", true); return; }
    const body = { titulo: d.titulo.trim(), resumen: d.resumen || "", emoji: d.emoji || "📘", cuerpo: d.cuerpo || "", actualizado: hoyISO() };
    let id = d._id;
    if (!id) { id = "m-" + slug(d.titulo) + "-" + rnd(); body.id = id; body.orden = Math.max(0, ...S.db.manual.map((x) => Number(x.orden) || 0)) + 1; }
    if (await guardar("manual", d._id || null, body, d._id ? "✓ Procedimiento guardado." : "✓ Procedimiento creado.")) { S.man.edit = false; S.man.sel = id; render(); }
  },
  async borrarManual(id) {
    const x = S.db.manual.find((y) => y.id === id); if (!x) return;
    if (!confirm(`¿Borrar “${x.titulo}” del manual?`)) return;
    if (await borrar("manual", id, "Procedimiento borrado.")) { S.man = { sel: null, edit: false, draft: null, ticks: S.man.ticks }; S.det.manual = false; render(); }
  },
  async moverManual(arg) {
    const [id, dir] = arg.split("|");
    const lst = [...S.db.manual].sort((a, b) => (Number(a.orden) || 0) - (Number(b.orden) || 0));
    const i = lst.findIndex((x) => x.id === id), j = i + Number(dir);
    if (i < 0 || j < 0 || j >= lst.length) return;
    [lst[i], lst[j]] = [lst[j], lst[i]];
    try { for (let k = 0; k < lst.length; k++) if (Number(lst[k].orden) !== k + 1) await api("PUT", "/manual/" + encodeURIComponent(lst[k].id), { orden: k + 1 }); await cargar("manual"); render(); }
    catch (e) { toast("No se pudo mover: " + e.message, true); }
  },
  async cargarManualBase() {
    try {
      for (const m of MANUAL_BASE) if (!S.db.manual.some((x) => x.id === m.id)) await api("POST", "/manual", { ...m, actualizado: hoyISO() });
      await cargar("manual"); S.man.sel = MANUAL_BASE[0].id; render(); toast("✓ Manual cargado. Editalo cuando quieras.");
    } catch (e) { toast("No se pudo cargar: " + e.message, true); }
  },

  // ---------- notas ----------
  nuevaNota(cid) {
    if (S.faltaManual) { A.go("notas"); return; }
    const deCliente = typeof cid === "string" && cid ? cid : (S.screen === "clientes" && S.det.clientes && S.d.cli ? S.d.cli.id : "");
    S.d.nota = { _id: null, texto: "", cliente_id: deCliente, recordar: "" };
    render();
    setTimeout(() => { const el = document.querySelector('[data-b="nota.texto"]'); if (el) el.focus(); }, 30);
  },
  editarNota(id) { const n = S.db.notas.find((x) => x.id === id); if (!n) return; S.d.nota = { ...n, _id: n.id, cliente_id: n.cliente_id || "", recordar: n.recordar || "" }; render(); },
  notaFecha(v) { S.d.nota.recordar = v; render(); },
  cerrarNota() { S.d.nota = null; render(); },
  cerrarNotaFondo(_, el, ev) { if (ev.target === el) A.cerrarNota(); },
  async guardarNota() {
    const n = S.d.nota;
    if (!String(n.texto || "").trim()) { msgEn("#notaMsg", "Escribí algo en la nota."); return; }
    const body = { texto: n.texto.trim(), cliente_id: n.cliente_id || null, recordar: n.recordar || "" };
    if (!n._id) { body.id = "nota-" + Date.now().toString(36) + rnd(); body.creada = new Date().toISOString(); body.hecha = 0; }
    if (await guardar("notas", n._id || null, body, n._id ? "✓ Nota guardada." : "✓ Nota anotada.")) { S.d.nota = null; render(); }
  },
  async notaHecha(id) {
    const n = S.db.notas.find((x) => x.id === id); if (!n) return;
    if (await guardar("notas", id, { hecha: Number(n.hecha) ? 0 : 1 }, Number(n.hecha) ? "Nota pendiente de nuevo." : "✓ Hecha.")) render();
  },
  async borrarNota(id) { if (!confirm("¿Borrar esta nota?")) return; if (await borrar("notas", id, "Nota borrada.")) { S.d.nota = null; render(); } },
  async borrarHechas() {
    const h = S.db.notas.filter((n) => Number(n.hecha));
    if (!h.length || !confirm(`¿Borrar las ${h.length} notas hechas?`)) return;
    try { for (const n of h) await api("DELETE", "/notas/" + encodeURIComponent(n.id)); await cargar("notas"); render(); toast("✓ Notas hechas borradas."); }
    catch (e) { toast("No se pudo borrar: " + e.message, true); }
  },

  // ---------- notificaciones ----------
  nfTema(v) { S.d.nf.tema = v; S.d.nf.abre = (TEMAS.find((t) => t[0] === v) || [])[2]; render(); },
  nfCuando(v) { S.d.nf.cuando = v; render(); },
  nfLimpiar() { S.d.nf = nfVacia(); render(); },
  plantilla(i) {
    const n = S.d.nf, c = clientePorId(n.cliente_id);
    const P = [
      { tema: "Promos", abre: "Ficha del comercio", titulo: (c ? c.nombre : "[Comercio]") + ": promo de hoy", texto: "Solo por hoy. Tocá para ver los detalles." },
      { tema: "Eventos", abre: "Agenda de eventos", titulo: "Esta noche en Colón: [EVENTO]", texto: "Arranca a las [HORA]. Mirá la agenda completa." },
      { tema: "Rio", abre: "Pantalla del río", titulo: "Cambió el río: [ALTURA] m", texto: "Consultá el estado de las playas antes de ir." },
    ][Number(i)];
    Object.assign(n, P); render();
  },
  async guardarNotif(estado) {
    const n = S.d.nf, err = (t) => msgEn("#nfMsg", t);
    if (!n.titulo.trim()) return err("Falta el título.");
    if (estado === "Programada") {
      if (!n.texto.trim()) return err("Falta el mensaje.");
      if (n.titulo.length > 50 || n.texto.length > 120) return err("El texto es muy largo: en el celular se corta.");
      if (/\[[^\]]*\]/.test(n.titulo + n.texto)) return err("Completá lo que está entre corchetes [ ] antes de programarla.");
      if (n.tema === "Promos" && !n.cliente_id) return err("Elegí de qué comercio es la promo.");
      if (!n.hora || n.hora < "09:00" || n.hora > "21:00") return err("Elegí una hora entre las 9 y las 21.");
      if (n.cuando === "Programar" && (!n.fecha || n.fecha < hoyISO())) return err("Elegí un día de hoy en adelante.");
    }
    const body = { estado, tema: n.tema, cliente_id: n.cliente_id || null, titulo: n.titulo.trim(), texto: n.texto.trim(), abre: n.abre, cuando: n.cuando, fecha: n.cuando === "Programar" ? n.fecha : "", hora: n.hora, dia_semana: n.cuando === "Repetir" ? n.dia_semana : "" };
    if (!n._id) { body.id = "n-" + Date.now().toString(36) + rnd(); body.creada = new Date().toISOString(); }
    if (await guardar("notificaciones", n._id || null, body, estado === "Borrador" ? "Guardada como borrador." : "✓ Programada.")) { S.d.nf = nfVacia(); S.f.nfTab = estado; render(); }
  },
  editarNotif(id) { const x = S.db.notificaciones.find((y) => y.id === id); if (!x) return; S.d.nf = { ...nfVacia(), ...x, _id: x.id, cliente_id: x.cliente_id || "", fecha: x.fecha || manana(), dia_semana: x.dia_semana || "sábado" }; render(); arriba(); },
  async borrarNotif(id) { if (!confirm("¿Borrar esta notificación?")) return; if (await borrar("notificaciones", id, "Notificación borrada.")) { if (S.d.nf._id === id) S.d.nf = nfVacia(); render(); } },
};

// Crea un cliente y (opcional) su ficha. Devuelve el cliente o null.
async function altaCliente(c, ficha, publicar) {
  const id = slug(c.nombre) + "-" + rnd();
  const body = { id, nombre: c.nombre, cat: c.cat, rubro: c.rubro || "", contacto: c.contacto || "", whatsapp: c.whatsapp || "", estado: c.estado, plan: c.estado === "Activo" ? "Destacado" : "", precio: c.precio, vence: c.vence || "", desde: hoyISO(), origen: c.origen, notas: c.notas || "", visible: publicar ? 1 : 0 };
  if (!(await guardar("clientes", null, body))) return null;
  if (ficha) {
    const t = tipoDesdeCliente(c.cat, c.rubro);
    const lb = { id: idLibre(c.nombre, "lugares"), nombre: c.nombre, tipo: t.tipo, categoria: t.categoria, emoji: EMOJI_CAT[c.cat] || "📍", color: COLOR_CAT[c.cat] || "#1E88E5", whatsapp: c.whatsapp || "", desc: ficha.desc || "", horario: ficha.horario || "", dir: ficha.dir || "", tel: ficha.tel || "", tags: ficha.tags || [], info: [], visible: publicar ? 1 : 0, cliente_id: id };
    await guardar("lugares", null, lb);
  }
  return clientePorId(id);
}

// =====================================================================
//  PINTAR Y ESCUCHAR
// =====================================================================
const VISTAS = { inicio: vInicio, clientes: vClientes, fichas: vFichas, eventos: vEventos, servicios: vServicios, pendientes: vPendientes, notif: vNotif, cobros: vCobros, notas: vNotas, manual: vManual, ajustes: vAjustes };
function render() {
  if (!VISTAS[S.screen]) S.screen = "inicio";
  const ae = document.activeElement;
  const foco = ae && (ae.dataset.q || ae.dataset.b) ? { q: ae.dataset.q, b: ae.dataset.b, s: ae.selectionStart, e: ae.selectionEnd } : null;
  $("#side").innerHTML = vistaMenu();
  $("#side").classList.toggle("open", S.menu);
  $("#scrim").className = S.menu ? "scrim" : "";
  $("#mtitle").textContent = tituloDe(S.screen);
  $("#banner").innerHTML = S.demo ? '<div class="banner amb"><span style="flex:1"><b>Modo ejemplo:</b> son datos inventados y nada de lo que cambies toca la app real.</span></div>' : "";
  $("#main").innerHTML = VISTAS[S.screen]();
  $("#modal").innerHTML = vModalNuevo() + vModalNota();
  if (!$("#app").hidden) $("#fab").hidden = !!(S.d.nota || S.d.nuevo);
  document.title = tituloDe(S.screen) + " · Colón 360";
  if (foco) {
    const el = document.querySelector(foco.q ? `[data-q="${foco.q}"]` : `[data-b="${foco.b}"]`);
    if (el) { el.focus(); try { if (foco.s !== null && foco.s !== undefined) el.setSelectionRange(foco.s, foco.e); } catch { /* inputs sin selección */ } }
  }
}
function setRuta(path, valor) {
  const ps = path.split(".");
  let o = S.d;
  for (let i = 0; i < ps.length - 1; i++) { if (!o[ps[i]]) return; o = o[ps[i]]; }
  o[ps[ps.length - 1]] = valor;
}
function alCambiar(el) {
  if (el.dataset.q !== undefined) { S.q[el.dataset.q] = el.value; render(); return; }
  if (el.dataset.aj) {
    if (el.dataset.aj === "precio") { S.precio = Number(el.value) || 0; localStorage.setItem("c360_precio", String(S.precio)); }
    if (el.dataset.aj === "cupo") { S.cupo = el.value; localStorage.setItem("c360_cupo", S.cupo); }
    return;
  }
  const b = el.dataset.b; if (!b) return;
  const v = el.type === "checkbox" ? (el.checked ? 1 : 0) : el.value;
  setRuta(b, v);
  // dependencias
  if (b === "nuevo.cat") S.d.nuevo.rubro = (RUBROS[v] || [""])[0];
  if (b === "cli.cat") S.d.cli.rubro = "";
  if (b === "pd.d.cat") S.d.pd.d.rubro = "";
  if (b === "fx.tipo" && !["hotel", "parador", "camping"].includes(v) && TIPOS_HOTEL.includes(S.d.fx.categoria)) S.d.fx.categoria = "";
  if (b === "fx.id") S.d.fx._idAuto = false;
  if (b === "ev.id") S.d.ev._idAuto = false;
  if (b === "fx.nombre" && S.d.fx._idAuto && !S.d.fx._id) { S.d.fx.id = idLibre(v, "lugares"); const i = document.querySelector('[data-b="fx.id"]'); if (i) i.value = S.d.fx.id; }
  if (b === "ev.titulo" && S.d.ev._idAuto && !S.d.ev._id) { S.d.ev.id = idLibre(v, "eventos"); const i = document.querySelector('[data-b="ev.id"]'); if (i) i.value = S.d.ev.id; }
  if (el.dataset.r) { render(); return; }
  // actualizaciones en vivo
  if (b.startsWith("fx.")) { const pv = $("#pv"); if (pv) pv.innerHTML = vistaPrevia(S.d.fx); if (b === "fx.ubicacion") { const u = $("#ubicInfo"); if (u) u.innerHTML = ubicInfo(S.d.fx); } }
  if (b.startsWith("nf.")) {
    const pv = $("#nfpv"); if (pv) pv.innerHTML = previaNotif(S.d.nf);
    const tl = $("#tl"); if (tl) { tl.textContent = S.d.nf.titulo.length + " / 50"; tl.style.color = S.d.nf.titulo.length > 50 ? "#8A2B1F" : ""; }
    const ml = $("#ml"); if (ml) { ml.textContent = S.d.nf.texto.length + " / 120"; ml.style.color = S.d.nf.texto.length > 120 ? "#8A2B1F" : ""; }
    if (b === "nf.hora" || b === "nf.dia_semana" || b === "nf.fecha") render();
  }
  if (b === "ev.fecha") render();
  if (b === "nota.recordar") render();
  if (b.startsWith("pd.d.")) { /* los avisos se actualizan al guardar */ }
}
document.addEventListener("input", (e) => { const el = e.target; if (el.matches("input:not([type=checkbox]):not([type=date]):not([type=time]), textarea")) alCambiar(el); });
document.addEventListener("change", (e) => { const el = e.target; if (el.matches("select, input[type=checkbox], input[type=date], input[type=time]")) alCambiar(el); });
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) { if (e.target.id === "scrim" && S.menu) A.menu(); return; }
  const fn = A[el.dataset.act];
  if (fn) { if (el.tagName === "A") e.preventDefault(); fn(el.dataset.arg, el, e); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (S.d.nota) A.cerrarNota(); else if (S.d.nuevo) A.cerrarModal(); else if (S.menu) A.menu(); } });
window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (k && k !== S.screen && VISTAS[k]) { S.screen = k; render(); } });

// =====================================================================
//  ENTRAR
// =====================================================================
async function probarClave(k) {
  S.key = k;
  try {
    const r = await fetch(API_URL + "/api/admin/ping", { headers: { "X-Admin-Key": k } });
    if (r.status === 200) return true;
    if (r.status === 401) return false;
    // API vieja (todavía sin /admin/ping): se prueba como el panel anterior
    const r2 = await fetch(API_URL + "/api/lugares", { method: "POST", headers: { "X-Admin-Key": k, "Content-Type": "application/json" }, body: "{}" });
    return r2.status !== 401;
  } catch { throw new Error("Sin conexión con la API."); }
}
async function entrar() {
  $("#login").hidden = true;
  $("#app").hidden = false;
  $("#fab").hidden = false;
  $("#main").innerHTML = '<div class="loading">Cargando…</div>';
  pintarDeco();
  render();
  try { await cargarTodo(); } catch (e) { toast("No se pudieron cargar los datos: " + e.message, true); }
  render();
}
$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const k = $("#clave").value.trim();
  const er = $("#login-err"); er.hidden = true;
  try {
    if (await probarClave(k)) { localStorage.setItem(LS_KEY, k); entrar(); }
    else { er.textContent = "Clave incorrecta."; er.hidden = false; }
  } catch (x) { er.textContent = x.message; er.hidden = false; }
});
(async function init() {
  if (new URLSearchParams(location.search).has("demo")) { A.demo(); return; }
  if (S.key) {
    try { if (await probarClave(S.key)) { entrar(); return; } } catch { /* se muestra el login */ }
  }
  $("#login").hidden = false;
  $("#clave").focus();
})();
</script>
